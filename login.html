<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود — کلینیک  دکتر ظهرابی</title> 
<link rel="icon" href="/images/logo-rel.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--d:#0f172a;--p:#16a34a;--p2:#15803d;--s:#dcfce7;--mid:#2e86c1;--w:#fff;--g:#f8fafc;--e:#334155;--m:#64748b;--br:#e2e8f0;--r:12px;--rr:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--g);min-height:100vh;display:flex;direction:rtl}
.login-side{flex:1;background:linear-gradient(135deg,#0f172a 0%,#1a5276 50%,#16a34a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;color:var(--w);position:relative;overflow:hidden}
.login-side::before{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%);border-radius:50%;top:-100px;right:-100px}
.login-side::after{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(22,163,74,.1),transparent 70%);border-radius:50%;bottom:-80px;left:-80px}
.login-brand{font-size:2rem;font-weight:900;margin-bottom:.5rem;position:relative;z-index:1}
.login-brand span{color:#86efac}
.login-desc{font-size:.95rem;opacity:.7;max-width:320px;text-align:center;line-height:1.8;position:relative;z-index:1}
.login-features{margin-top:3rem;display:flex;flex-direction:column;gap:1rem;position:relative;z-index:1}
.login-feat{display:flex;align-items:center;gap:.75rem;font-size:.88rem;opacity:.8}
.login-feat i{width:36px;height:36px;background:rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1rem}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{width:100%;max-width:400px}
.login-card h2{font-size:1.6rem;font-weight:800;color:var(--d);margin-bottom:.5rem}
.login-card>p{color:var(--m);font-size:.88rem;margin-bottom:2rem}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--e);margin-bottom:.4rem}
.form-input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--br);border-radius:var(--r);font-size:.9rem;font-family:inherit;color:var(--e);background:var(--w);outline:none;transition:border-color .3s,box-shadow .3s}
.form-input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.form-input::placeholder{color:#94a3b8}
.form-row{display:flex;gap:1rem}
.form-row .form-group{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.85rem;border-radius:var(--r);font-size:.92rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .3s}
.btn-p{background:var(--p);color:var(--w);box-shadow:0 4px 14px rgba(22,163,74,.25)}
.btn-p:hover{background:var(--p2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(22,163,74,.3)}
.btn-o{background:transparent;color:var(--p);border:1.5px solid var(--p);margin-top:.75rem}
.btn-o:hover{background:var(--s)}
.form-divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--m);font-size:.8rem}
.form-divider::before,.form-divider::after{content:'';flex:1;height:1px;background:var(--br)}
.login-footer{text-align:center;margin-top:1.5rem;font-size:.82rem;color:var(--m)}
.login-footer a{color:var(--p);font-weight:600}
.alert{padding:.75rem 1rem;border-radius:var(--r);font-size:.82rem;margin-bottom:1rem;display:none}
.alert-err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.alert-ok{background:var(--s);color:var(--p);border:1px solid #bbf7d0}
@media(max-width:768px){
  body{flex-direction:column}
  .login-side{padding:2.5rem 1.5rem;min-height:auto}
  .login-features{display:none}
  .login-form-side{padding:1.5rem}
  .form-row{flex-direction:column;gap:0}
}
</style>
</head>
<body>

<div class="login-side">
  <img src="images/logo.png" alt="لوگو" style="width:80px;height:80px;border-radius:16px;object-fit:cover;margin-bottom:1.5rem;box-shadow:0 8px 24px rgba(0,0,0,.3)">
  <div class="login-brand">کلینیک <span> دکتر ظهرابی</span></div>
  <p class="login-desc">با ورود به پنل خود، برنامه غذایی اختصاصی، نوبت‌دهی و پیگیری سلامت خود را مدیریت کنید.</p>
  <div class="login-features">
    <div class="login-feat"><i>📋</i>مشاهده برنامه غذایی</div>
    <div class="login-feat"><i>📅</i>نوبت‌دهی آنلاین</div>
    <div class="login-feat"><i>📊</i>پیگیری پیشرفت</div>
    <div class="login-feat"><i>💬</i>مشاوره با متخصص</div>
  </div>
</div>

<div class="login-form-side">
  <div class="login-card">
    <h2>خوش آمدید</h2>
    <p>برای ورود، اطلاعات خود را وارد کنید</p>

    <div class="alert alert-err" id="alert-err"></div>
    <div class="alert alert-ok" id="alert-ok"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>شماره موبایل</label>
        <input type="tel" class="form-input" id="phone" placeholder="09123456789" required maxlength="11" pattern="09[0-9]{9}">
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" class="form-input" id="pass" placeholder="رمز عبور خود را وارد کنید" required minlength="4">
      </div>
      <button type="submit" class="btn btn-p">ورود به پنل</button>
    </form>

    <div class="login-footer">
      حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
    </div>
  </div>
</div>

<script>
function hideAlerts(){document.getElementById('alert-err').style.display='none';document.getElementById('alert-ok').style.display='none'}

async function handleLogin(e){
  e.preventDefault();
  hideAlerts();
  const phone=document.getElementById('phone').value;
  const pass=document.getElementById('pass').value;

  if(phone.length!==11||!phone.startsWith('09')){
    document.getElementById('alert-err').textContent='شماره موبایل معتبر نیست';
    document.getElementById('alert-err').style.display='block';
    return;
  }
  if(pass.length<4){
    document.getElementById('alert-err').textContent='رمز عبور باید حداقل ۴ کاراکتر باشد';
    document.getElementById('alert-err').style.display='block';
    return;
  }

  try{
    const resp=await fetch('/api/index.php?action=auth/login',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:phone,password:pass})
    });
    const data=await resp.json();

    if(!data.success){
      document.getElementById('alert-err').textContent=data.message||'شماره موبایل یا رمز عبور نادرست است';
      document.getElementById('alert-err').style.display='block';
      return;
    }

    localStorage.setItem('zohra_user',JSON.stringify(data.data));

    const role=data.data.role;
    if(role==='doctor')window.location.href='dashboard-doctor.html';
    else if(role==='receptionist')window.location.href='dashboard-receptionist.html';
    else window.location.href='dashboard-user.html';

  }catch(err){
    document.getElementById('alert-err').textContent='خطا در اتصال به سرور';
    document.getElementById('alert-err').style.display='block';
  }
}

// Check if already logged in
(async function(){
  try{
    const resp=await fetch('/api/index.php?action=auth/me',{credentials:'include'});
    const data=await resp.json();
    if(data.success&&data.user){
      localStorage.setItem('zohra_user',JSON.stringify(data.user));
      const role=data.user.role;
      if(role==='doctor')window.location.href='dashboard-doctor.html';
      else if(role==='receptionist')window.location.href='dashboard-receptionist.html';
      else if(role==='user')window.location.href='dashboard-user.html';
    }
  }catch(e){}
})();
</script>

</body>
</html>
